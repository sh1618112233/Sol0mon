name: Offline tests

on:
  push:
    branches: [main, fix/core-reliability]
  pull_request:
  workflow_dispatch:

jobs:
  linux_server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Sol0mon/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r Sol0mon/requirements.txt
      - name: Compile application
        run: python -m compileall -q Sol0mon
      - name: Check Linux/server CLI startup
        run: python Sol0mon/sol0mon_cli.py --help
      - name: Run offline suite
        run: python -m pytest -ra

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Sol0mon-Windows/requirements.txt
      - name: Install Windows dependencies
        run: python -m pip install -r requirements.txt
        working-directory: Sol0mon-Windows
      - name: Compile Windows application
        run: python -m compileall -q .
        working-directory: Sol0mon-Windows
      - name: Check Windows CLI startup
        run: python sol0mon_cli.py --help
        working-directory: Sol0mon-Windows
      - name: Run Windows offline suite
        run: python -m pytest -ra
        working-directory: Sol0mon-Windows
